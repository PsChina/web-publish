[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-publish"
version = "0.3.0"
description = "Publish markdown to Juejin / CSDN / Zhihu from Claude Code — Python SDK + dual backend (opencli-bridge / urllib)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/PsChina/web-publish"
Issues = "https://github.com/PsChina/web-publish/issues"

[project.scripts]
web-publish = "web_publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
web_publish = []
